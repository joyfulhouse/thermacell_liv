name: Bronze Quality Scale Validation

on:
  push:
    branches:
      - 'claude/bronze-*'
      - 'claude/silver-*'
      - 'claude/gold-*'
      - 'claude/platinum-*'
      - 'claude/home-assistant-*'
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-bronze:
    name: Validate Bronze Tier Requirements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint black isort homeassistant voluptuous aiohttp

      - name: Code Quality - Black (formatting)
        run: |
          black --check --diff *.py

      - name: Code Quality - isort (import sorting)
        run: |
          isort --check-only --diff *.py

      - name: Code Quality - Pylint
        run: |
          pylint *.py --disable=C0114,C0115,C0116,R0913,R0914,R0912,R0915 --max-line-length=120

      - name: Bronze - Validate manifest.json
        run: |
          python -c "
          import json
          with open('manifest.json') as f:
              manifest = json.load(f)

          # Verify required fields
          assert 'domain' in manifest, 'Missing domain'
          assert 'name' in manifest, 'Missing name'
          assert 'codeowners' in manifest, 'Missing codeowners'
          assert 'config_flow' in manifest, 'Missing config_flow'
          assert manifest['config_flow'] == True, 'config_flow must be True'
          assert 'documentation' in manifest, 'Missing documentation'
          assert 'requirements' in manifest, 'Missing requirements'
          assert 'version' in manifest, 'Missing version'

          print('✓ manifest.json validation passed')
          "

      - name: Bronze - Validate entity naming (has_entity_name)
        run: |
          python -c "
          import sys

          files = ['switch.py', 'light.py', 'sensor.py', 'button.py']
          errors = []

          for file in files:
              with open(file) as f:
                  content = f.read()
                  if 'has_entity_name = True' not in content:
                      errors.append(f'{file}: Missing has_entity_name = True')

          if errors:
              for error in errors:
                  print(f'✗ {error}')
              sys.exit(1)
          else:
              print('✓ All entities have has_entity_name = True')
          "

      - name: Bronze - Validate runtime_data usage
        run: |
          python -c "
          import sys

          # Check __init__.py uses runtime_data
          with open('__init__.py') as f:
              content = f.read()
              if 'entry.runtime_data' not in content:
                  print('✗ __init__.py does not use entry.runtime_data')
                  sys.exit(1)
              if 'hass.data[DOMAIN]' in content and 'entry.entry_id' in content:
                  print('✗ __init__.py still uses old hass.data pattern')
                  sys.exit(1)

          # Check platforms use config_entry.runtime_data
          files = ['switch.py', 'light.py', 'sensor.py', 'button.py']
          for file in files:
              with open(file) as f:
                  content = f.read()
                  if 'config_entry.runtime_data' not in content:
                      print(f'✗ {file} does not use config_entry.runtime_data')
                      sys.exit(1)

          print('✓ All files correctly use runtime_data')
          "

      - name: Bronze - Validate unique config entry
        run: |
          python -c "
          import sys

          with open('config_flow.py') as f:
              content = f.read()
              if 'async_set_unique_id' not in content:
                  print('✗ config_flow.py missing unique_id handling')
                  sys.exit(1)
              if '_abort_if_unique_id_configured' not in content:
                  print('✗ config_flow.py missing duplicate prevention')
                  sys.exit(1)

          print('✓ Unique config entry validation passed')
          "

      - name: Bronze - Validate documentation structure
        run: |
          python -c "
          import sys
          import os

          required_docs = {
              'README.md': [
                  'Installation',
                  'Configuration',
                  'Uninstallation',
                  'Requirements',
                  'Dependencies'
              ]
          }

          errors = []
          for doc_file, sections in required_docs.items():
              if not os.path.exists(doc_file):
                  errors.append(f'{doc_file} not found')
                  continue

              with open(doc_file) as f:
                  content = f.read()
                  for section in sections:
                      if section not in content:
                          errors.append(f'{doc_file} missing section: {section}')

          if errors:
              for error in errors:
                  print(f'✗ {error}')
              sys.exit(1)
          else:
              print('✓ Documentation structure validated')
          "

      - name: Bronze - Validate translations
        run: |
          python -c "
          import json
          import sys

          # Check strings.json
          with open('strings.json') as f:
              strings = json.load(f)

          assert 'config' in strings, 'Missing config section in strings.json'
          assert 'error' in strings['config'], 'Missing error section'
          assert 'abort' in strings['config'], 'Missing abort section'

          # Check translations/en.json
          with open('translations/en.json') as f:
              translations = json.load(f)

          assert 'config' in translations, 'Missing config in en.json'
          assert 'entity' in translations, 'Missing entity translations'

          print('✓ Translation files validated')
          "

      - name: Bronze - Syntax validation
        run: |
          python -m py_compile __init__.py
          python -m py_compile api.py
          python -m py_compile config_flow.py
          python -m py_compile coordinator.py
          python -m py_compile switch.py
          python -m py_compile light.py
          python -m py_compile sensor.py
          python -m py_compile button.py
          echo "✓ All Python files have valid syntax"

      - name: Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Bronze Quality Scale Requirements PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Validated:"
          echo "  ✓ runtime-data: ConfigEntry.runtime_data usage"
          echo "  ✓ unique-config-entry: Duplicate prevention"
          echo "  ✓ has-entity-name: Entity naming conventions"
          echo "  ✓ config-flow: UI configuration"
          echo "  ✓ entity-unique-id: Unique identifiers"
          echo "  ✓ Documentation: Installation, removal, dependencies"
          echo "  ✓ Translations: strings.json and en.json"
          echo "  ✓ Code quality: Formatting and linting"
          echo ""
