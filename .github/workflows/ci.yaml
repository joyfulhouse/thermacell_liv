name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Code Quality
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio homeassistant voluptuous aiohttp
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --cov=custom_components.thermacell_liv --cov-report=term-missing --cov-fail-under=85 --ignore=tests/manual --ignore=tests/integration --ignore=tests/debug

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage report generated. See logs for details." >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy homeassistant voluptuous aiohttp

      - name: Run mypy
        run: mypy custom_components/thermacell_liv --config-file .mypy.ini

  # ===========================================================================
  # Quality Scale Tiers
  # ===========================================================================
  bronze:
    name: Bronze Tier
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate manifest.json
        run: |
          python -c "
          import json
          with open('custom_components/thermacell_liv/manifest.json') as f:
              manifest = json.load(f)

          required = ['domain', 'name', 'codeowners', 'config_flow', 'version', 'requirements', 'iot_class']
          for field in required:
              assert field in manifest, f'Missing {field}'
          assert manifest['config_flow'] == True, 'config_flow must be True'
          print('✓ manifest.json valid')
          "

      - name: Validate entity naming
        run: |
          python -c "
          with open('custom_components/thermacell_liv/entity.py') as f:
              if 'has_entity_name = True' not in f.read():
                  raise Exception('entity.py: Missing has_entity_name in base class')

          files = ['switch.py', 'light.py', 'sensor.py', 'button.py']
          for file in files:
              with open(f'custom_components/thermacell_liv/{file}') as f:
                  if 'ThermacellLivEntity' not in f.read():
                      raise Exception(f'{file}: Not using ThermacellLivEntity base class')
          print('✓ Entity naming compliant')
          "

      - name: Validate runtime data & unique config
        run: |
          python -c "
          with open('custom_components/thermacell_liv/__init__.py') as f:
              content = f.read()
              assert 'entry.runtime_data' in content, 'Missing runtime_data usage'

          with open('custom_components/thermacell_liv/config_flow.py') as f:
              content = f.read()
              assert 'async_set_unique_id' in content, 'Missing async_set_unique_id'
              assert '_abort_if_unique_id_configured' in content, 'Missing _abort_if_unique_id_configured'
          print('✓ Runtime data and unique config compliant')
          "

  silver:
    name: Silver Tier
    runs-on: ubuntu-latest
    needs: [bronze, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate reauthentication flow
        run: |
          python -c "
          with open('custom_components/thermacell_liv/config_flow.py') as f:
              content = f.read()
              assert 'async_step_reauth' in content, 'Missing async_step_reauth'
              assert 'async_step_reauth_confirm' in content, 'Missing async_step_reauth_confirm'
          print('✓ Reauthentication flow implemented')
          "

      - name: Validate logging
        run: |
          python -c "
          with open('custom_components/thermacell_liv/coordinator.py') as f:
              content = f.read()
              required = ['is now offline', 'service unavailable', 'Failed to set']
              for log_msg in required:
                  assert log_msg in content, f'Missing log: {log_msg}'
          print('✓ Unavailability logging implemented')
          "

  gold:
    name: Gold Tier
    runs-on: ubuntu-latest
    needs: [silver]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate diagnostics
        run: |
          python -c "
          import os
          assert os.path.exists('custom_components/thermacell_liv/diagnostics.py'), 'Missing diagnostics.py'

          with open('custom_components/thermacell_liv/diagnostics.py') as f:
              content = f.read()
              assert 'async_get_config_entry_diagnostics' in content
              assert 'async_redact_data' in content
              assert 'TO_REDACT' in content
          print('✓ Diagnostics platform implemented')
          "

      - name: Validate repairs
        run: |
          python -c "
          import os, json
          assert os.path.exists('custom_components/thermacell_liv/repairs.py'), 'Missing repairs.py'

          with open('custom_components/thermacell_liv/repairs.py') as f:
              assert 'async_create_fix_flow' in f.read()

          with open('custom_components/thermacell_liv/strings.json') as f:
              strings = json.load(f)
              assert 'issues' in strings
              assert 'auth_failed' in strings['issues']
              assert 'device_offline' in strings['issues']
          print('✓ Repair flows implemented')
          "

      - name: Validate reconfiguration & entity defaults
        run: |
          python -c "
          with open('custom_components/thermacell_liv/config_flow.py') as f:
              content = f.read()
              assert 'ThermacellLivOptionsFlow' in content
              assert 'async_step_init' in content

          with open('custom_components/thermacell_liv/__init__.py') as f:
              assert 'async_reload_entry' in f.read()

          with open('custom_components/thermacell_liv/sensor.py') as f:
              content = f.read()
              assert content.count('entity_registry_enabled_default = False') >= 3
          print('✓ Reconfiguration and entity defaults compliant')
          "

  platinum:
    name: Platinum Tier
    runs-on: ubuntu-latest
    needs: [gold, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate py.typed marker
        run: |
          test -f custom_components/thermacell_liv/py.typed || (echo "Missing py.typed" && exit 1)
          echo "✓ py.typed marker present"

      - name: Validate mypy strict config
        run: |
          python -c "
          with open('.mypy.ini') as f:
              content = f.read()
              assert 'strict = True' in content or 'strict = true' in content or 'disallow_untyped_defs' in content
          print('✓ Mypy strict mode configured')
          "

      - name: Validate TypedDict definitions
        run: |
          test -f custom_components/thermacell_liv/thermacell_types.py || (echo "Missing TypedDict definitions" && exit 1)
          echo "✓ TypedDict definitions present"

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, bronze, silver, gold, platinum]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Scale" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bronze | ${{ needs.bronze.result == 'success' && '🥉 Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Silver | ${{ needs.silver.result == 'success' && '🥈 Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gold | ${{ needs.gold.result == 'success' && '🥇 Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platinum | ${{ needs.platinum.result == 'success' && '💎 Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if all required jobs passed
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.platinum.result }}" != "success" ]; then
            echo "❌ **CI Failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "🎉 **All checks passed - Platinum Quality Scale certified!**" >> $GITHUB_STEP_SUMMARY
          fi
