name: Gold Quality Scale Validation

on:
  push:
    branches:
      - 'claude/gold-*'
      - 'claude/platinum-*'
      - 'claude/home-assistant-*'
      - main
  pull_request:
    branches:
      - main

jobs:
  # Run Silver tier checks first as prerequisites
  silver-validation:
    name: Silver Tier Prerequisites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint black isort mypy homeassistant voluptuous aiohttp pytest pytest-cov

      - name: Run Silver validations
        run: |
          echo "✓ Running Silver tier prerequisite checks..."

          # Reauthentication flow
          python -c "
          with open('config_flow.py') as f:
              content = f.read()
              assert 'async_step_reauth' in content
              assert 'async_step_reauth_confirm' in content
          print('✓ Reauthentication flow present')
          "

  # Gold tier specific validations
  validate-gold:
    name: Validate Gold Tier Requirements
    runs-on: ubuntu-latest
    needs: silver-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy homeassistant voluptuous aiohttp black isort

      - name: Gold - Validate diagnostics platform
        run: |
          python -c "
          import sys
          import os

          if not os.path.exists('diagnostics.py'):
              print('✗ Missing diagnostics.py')
              sys.exit(1)

          with open('diagnostics.py') as f:
              content = f.read()
              if 'async_get_config_entry_diagnostics' not in content:
                  print('✗ Missing async_get_config_entry_diagnostics function')
                  sys.exit(1)
              if 'async_redact_data' not in content:
                  print('✗ Missing data redaction')
                  sys.exit(1)
              if 'TO_REDACT' not in content:
                  print('✗ Missing TO_REDACT configuration')
                  sys.exit(1)

          print('✓ Diagnostics platform implemented')
          "

      - name: Gold - Validate repair flows
        run: |
          python -c "
          import sys
          import os

          if not os.path.exists('repairs.py'):
              print('✗ Missing repairs.py')
              sys.exit(1)

          with open('repairs.py') as f:
              content = f.read()
              if 'async_create_fix_flow' not in content:
                  print('✗ Missing async_create_fix_flow function')
                  sys.exit(1)

          # Check for repair translations
          import json
          with open('strings.json') as f:
              strings = json.load(f)
              if 'issues' not in strings:
                  print('✗ Missing repair flow translations in strings.json')
                  sys.exit(1)
              if 'auth_failed' not in strings['issues']:
                  print('✗ Missing auth_failed repair flow')
                  sys.exit(1)
              if 'device_offline' not in strings['issues']:
                  print('✗ Missing device_offline repair flow')
                  sys.exit(1)

          print('✓ Repair flows implemented')
          "

      - name: Gold - Validate reconfiguration flow
        run: |
          python -c "
          import sys

          with open('config_flow.py') as f:
              content = f.read()
              if 'ThermacellLivOptionsFlow' not in content:
                  print('✗ Missing options flow class')
                  sys.exit(1)
              if 'async_step_init' not in content:
                  print('✗ Missing async_step_init in options flow')
                  sys.exit(1)

          with open('__init__.py') as f:
              content = f.read()
              if 'async_reload_entry' not in content:
                  print('✗ Missing reload entry handler')
                  sys.exit(1)

          print('✓ Reconfiguration flow implemented')
          "

      - name: Gold - Validate entity disabled by default
        run: |
          python -c "
          import sys

          with open('sensor.py') as f:
              content = f.read()
              # Check for at least some diagnostic sensors with disabled by default
              if content.count('entity_registry_enabled_default = False') < 3:
                  print('✗ Insufficient diagnostic sensors with disabled by default')
                  sys.exit(1)

          print('✓ Entity disabled by default implemented')
          "

      - name: Gold - Validate documentation completeness
        run: |
          python -c "
          import sys

          with open('README.md') as f:
              content = f.read()
              required_sections = [
                  'Supported Entities',
                  'Supported Devices',
                  'Use Cases',
                  'Data Updates',
                  'Known Limitations',
                  'Troubleshooting',
              ]

              missing = []
              for section in required_sections:
                  if section not in content:
                      missing.append(section)

              if missing:
                  print(f'✗ Missing documentation sections: {missing}')
                  sys.exit(1)

          print('✓ Documentation completeness validated')
          "

  # Platinum tier validations
  validate-platinum:
    name: Validate Platinum Tier Requirements
    runs-on: ubuntu-latest
    needs: validate-gold

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy homeassistant voluptuous aiohttp

      - name: Platinum - Validate py.typed marker
        run: |
          python -c "
          import sys
          import os

          if not os.path.exists('py.typed'):
              print('✗ Missing py.typed marker file')
              sys.exit(1)

          print('✓ py.typed marker file present')
          "

      - name: Platinum - Validate mypy strict mode
        run: |
          python -c "
          import sys

          with open('pyproject.toml') as f:
              content = f.read()
              # Check that strict mode is enabled (not commented out)
              required_settings = [
                  'disallow_untyped_defs = true',
                  'disallow_incomplete_defs = true',
                  'disallow_untyped_calls = true',
              ]

              for setting in required_settings:
                  if setting not in content:
                      print(f'✗ Missing or disabled mypy strict setting: {setting}')
                      sys.exit(1)

          print('✓ Mypy strict mode configured')
          "

      - name: Platinum - Run mypy strict type checking
        run: |
          mypy --explicit-package-bases __init__.py api.py config_flow.py coordinator.py switch.py light.py sensor.py button.py diagnostics.py repairs.py || {
            echo "✗ Mypy strict type checking failed"
            exit 1
          }
          echo "✓ Mypy strict type checking passed"

      - name: Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Gold & Platinum Quality Scale Requirements PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Gold Tier Validated:"
          echo "  ✓ diagnostics: Complete diagnostic data with redaction"
          echo "  ✓ repair-issues: Authentication & device offline repairs"
          echo "  ✓ reconfigure: Runtime configuration with options flow"
          echo "  ✓ entity-disabled-by-default: Diagnostic sensors"
          echo "  ✓ docs-supported-functions: Complete function documentation"
          echo "  ✓ docs-supported-devices: Device specifications"
          echo "  ✓ docs-use-cases: Real-world usage scenarios"
          echo "  ✓ docs-data-update: Polling mechanism explained"
          echo "  ✓ docs-known-limitations: Comprehensive limitations"
          echo "  ✓ docs-troubleshooting: Enhanced troubleshooting"
          echo ""
          echo "Platinum Tier Validated:"
          echo "  ✓ strict-typing: py.typed marker + mypy strict mode"
          echo "  ✓ Full type annotation coverage"
          echo "  ✓ Mypy strict mode compliance"
          echo ""
