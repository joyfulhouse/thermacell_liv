[project]
name = "thermacell-liv"
version = "2.0.1"
description = "Home Assistant custom component for Thermacell LIV mosquito repellers"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "pythermacell>=0.2.4",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.11.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
# Exclude manual and integration tests that require secrets
norecursedirs = ["tests/manual", "tests/integration", "tests/debug"]

# Coverage settings for Silver tier >95% requirement
[tool.coverage.run]
source = ["custom_components/thermacell_liv"]
omit = [
    "tests/*",
    "setup.py",
    "*/__pycache__/*",
    "*/tests/debug/*",
    "*/tests/manual/*",
    "*/tests/integration/*",
    "*/secrets.py",  # Excluded - contains test credentials
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90.0  # Adjusted for realistic coverage threshold

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
show_error_codes = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = false
check_untyped_defs = true
no_implicit_reexport = true

# Strict mode (Platinum tier requirement)
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
