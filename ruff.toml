# Ruff configuration for Home Assistant custom component
# Based on Home Assistant's standards: https://github.com/home-assistant/core/blob/dev/pyruff.toml

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in argument defaults (common HA pattern)
    "B904",  # Use `raise from` to specify exception cause (not always needed)
]

[lint.per-file-ignores]
# Test files can have unused imports and other test-specific patterns
"tests/**" = ["F401", "F811"]

[format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.isort]
# Match Home Assistant's import ordering
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
