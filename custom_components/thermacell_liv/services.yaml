run_for:
  name: Run for a duration
  description: Program a native shutdown timer, then start the hub. Requires the hub schedule service.
  target:
    entity:
      integration: thermacell_liv
      domain: switch
      device_class: switch
  fields:
    minutes:
      name: Duration
      description: Run time in minutes (1 to 1440).
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
schedule_shutdown:
  name: Schedule shutdown
  description: Program a native shutdown within the next 24 hours without changing current power.
  target:
    entity:
      integration: thermacell_liv
      domain: switch
      device_class: switch
  fields:
    at:
      name: Shutdown time
      description: Local Home Assistant time unless a timezone offset is supplied.
      required: true
      selector:
        datetime:
cancel_timer:
  name: Cancel shutdown timer
  description: Remove the timer created by this integration. Does not turn the hub off or remove app schedules.
  target:
    entity:
      integration: thermacell_liv
      domain: switch
      device_class: switch
